<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>אישורי הגעה · יובל &amp; מורגן</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;500&family=Assistant:wght@300;400;600&family=Heebo:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
<style>
.sheet{max-width:820px;display:flex;flex-direction:column;gap:26px}
.head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:10px}
.head h1{font-family:"Frank Ruhl Libre",Georgia,serif;font-weight:400;font-size:30px;margin:0}
.head .when{font-family:"Heebo",sans-serif;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:rgba(201,167,88,.28)}
.tile{background:var(--ink);padding:22px 18px;text-align:center}
.tile .k{font-family:"Heebo",sans-serif;font-size:11px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.tile .v{font-family:"Frank Ruhl Libre",Georgia,serif;font-size:46px;line-height:1.1;font-variant-numeric:tabular-nums;margin-top:4px}
.wrap{overflow-x:auto;border:1px solid rgba(246,241,231,.12)}
table{width:100%;border-collapse:collapse;font-size:16px;min-width:480px}
th{
  font-family:"Heebo",sans-serif;font-size:11px;font-weight:500;letter-spacing:.2em;
  text-transform:uppercase;color:var(--gold);text-align:right;padding:12px 16px;
  border-bottom:1px solid rgba(201,167,88,.3);white-space:nowrap;
}
td{padding:14px 16px;border-bottom:1px solid rgba(246,241,231,.08);vertical-align:top}
tr:last-child td{border-bottom:0}
.nm{font-weight:600;white-space:nowrap}
.num{font-family:"Frank Ruhl Libre",Georgia,serif;font-size:21px;font-variant-numeric:tabular-nums;width:1%}
.nt{color:var(--ivory-dim);max-width:320px}
.tm{color:var(--ivory-faint);font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums;direction:ltr;text-align:right}
.mute{color:var(--ivory-faint)}
.msg{text-align:center;color:var(--ivory-dim);padding:36px 16px}
.share{border:1px solid rgba(201,167,88,.3);padding:18px;display:flex;flex-direction:column;gap:10px}
.share .k{font-family:"Heebo",sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.share .row{display:flex;gap:8px;flex-wrap:wrap}
.share input{
  flex:1 1 240px;min-width:0;background:var(--field);border:1px solid rgba(246,241,231,.18);
  color:var(--ivory);font-family:"Heebo",monospace;font-size:14px;padding:11px 13px;border-radius:2px;direction:ltr;text-align:left;
}
.share button{
  border:0;border-radius:2px;background:var(--gold);color:#13201B;cursor:pointer;
  font-family:"Heebo",sans-serif;font-weight:700;font-size:14px;padding:11px 20px;
}
.share button:hover{background:#DCBB6B}
.share p{margin:0;color:var(--ivory-dim);font-size:14px}
footer{text-align:center;color:var(--ivory-faint);font-size:13px;font-family:"Heebo",sans-serif}
</style>
</head>
<body>
<main class="sheet">
  <div class="head">
    <h1>אישורי הגעה</h1>
    <span class="when" id="when">טוען…</span>
  </div>

  <div class="tiles">
    <div class="tile"><div class="k">סך האורחים</div><div class="v" id="people">–</div></div>
    <div class="tile"><div class="k">אישורים</div><div class="v" id="count">–</div></div>
  </div>

  <div class="wrap">
    <table>
      <thead><tr><th>שם</th><th>כמה</th><th>הערה</th><th>מתי אישרו</th></tr></thead>
      <tbody id="tbody"><tr><td colspan="4" class="msg">טוען…</td></tr></tbody>
    </table>
  </div>

  <div class="share">
    <div class="k">הקישור לשליחה לאורחים</div>
    <div class="row">
      <input id="link" type="text" readonly>
      <button type="button" id="copy">העתקה</button>
      <button type="button" id="wa">שליחה בוואטסאפ</button>
    </div>
    <p>הדף הזה פרטי — רק מי שיש לו את הכתובת המלאה הזו, עם המפתח בסוף, רואה את הרשימה. אל תשלחו אותה לאורחים.</p>
  </div>

  <footer>מתרענן אוטומטית כל 30 שניות</footer>
</main>

<script>
(function(){
  var API='https://mjflpmjimvckkqxxkkvc.supabase.co/functions/v1/invite';
  var PUBLIC=location.href.replace(/list\.html.*$/,'');
  var key=(location.hash||'').replace(/^#/,'').trim();

  var tbody=document.getElementById('tbody');
  var linkInput=document.getElementById('link');
  linkInput.value=PUBLIC;

  function msg(text){
    tbody.innerHTML='';
    var tr=document.createElement('tr'), td=document.createElement('td');
    td.colSpan=4; td.className='msg'; td.textContent=text;
    tr.appendChild(td); tbody.appendChild(tr);
  }

  function fmt(iso){
    var d=new Date(iso);
    try{
      return new Intl.DateTimeFormat('he-IL',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',timeZone:'Asia/Jerusalem'}).format(d);
    }catch(e){ return d.toLocaleString(); }
  }

  function cell(cls, text){
    var td=document.createElement('td'); td.className=cls;
    if(text===null){ var s=document.createElement('span'); s.className='mute'; s.textContent='—'; td.appendChild(s); }
    else td.textContent=text;
    return td;
  }

  function load(){
    if(!key){
      document.getElementById('when').textContent='חסר מפתח';
      msg('הקישור חסר את המפתח הפרטי. הכתובת צריכה להסתיים ב־#המפתח.');
      return;
    }
    fetch(API+'?k='+encodeURIComponent(key),{cache:'no-store'})
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(!d || !d.rows){
          document.getElementById('when').textContent='מפתח שגוי';
          msg('המפתח בכתובת לא נכון.');
          return;
        }
        document.getElementById('people').textContent=d.people;
        document.getElementById('count').textContent=d.count;
        document.getElementById('when').textContent='עודכן ' + new Date().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
        if(!d.rows.length){ msg('עוד לא התקבלו אישורים. שלחו את הקישור ונתחיל לראות אותם כאן.'); return; }
        tbody.innerHTML='';
        d.rows.forEach(function(r){
          var tr=document.createElement('tr');
          tr.appendChild(cell('nm', r.name));
          tr.appendChild(cell('num', String(r.guests)));
          tr.appendChild(cell('nt', r.note ? r.note : null));
          tr.appendChild(cell('tm', fmt(r.created_at)));
          tbody.appendChild(tr);
        });
      })
      .catch(function(){
        document.getElementById('when').textContent='שגיאה';
        msg('לא הצלחנו לטעון את הרשימה. נסו לרענן בעוד רגע.');
      });
  }

  document.getElementById('copy').addEventListener('click',function(){
    var b=this;
    linkInput.select();
    var done=function(){ b.textContent='הועתק ✓'; setTimeout(function(){b.textContent='העתקה';},1800); };
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(linkInput.value).then(done,done); }
    else { try{document.execCommand('copy');done();}catch(e){} }
  });

  document.getElementById('wa').addEventListener('click',function(){
    var m='אתם מוזמנים לחגיגת החתונה של יובל ומורגן בישראל! יום ראשון, 25.10.2026. כל הפרטים ואישור הגעה: '+PUBLIC;
    window.open('https://wa.me/?text='+encodeURIComponent(m),'_blank','noopener');
  });

  load();
  setInterval(load, 30000);
})();
</script>
</body>
</html>
